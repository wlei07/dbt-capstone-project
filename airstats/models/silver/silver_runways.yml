models:
  - name: silver_runways
    description: runways
    columns:
      - name: runway_id
        description: identifier of runway
        data_tests:
          - not_null
          - unique
      - name: airport_ident
        description: identifier of airport
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('silver_airports')
                field: airport_ident
              config:
                severity: warn
      - name: runway_length_ft
        description: runway length in feet
      - name: runway_width_ft
        description: runway width in feed
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                strictly: false
      - name: runway_surface
        description: run surface
        data_tests:
          - not_null
      - name: runway_lighted
        description: is the runway lighted
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [0, 1]
                quote: false
      - name: runway_closed
        description: is the runway closed
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [0, 1]
                quote: false
